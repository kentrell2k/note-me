<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Noted: quick-capture notes that title themselves, with stickers, notebooks and a calendar.">
<style>html,body{margin:0}[hidden]{display:none!important}</style>
<title>Noted</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Caveat&family=Kalam&family=Patrick+Hand&family=Playfair+Display&family=Lora&family=Roboto+Slab&family=Space+Mono&family=Oswald&family=Pacifico&display=swap">
<style>
/* Three columns. Left: search, recents, categories. Middle: the open note, calendar or page. Right: Coming up only. Bars resize and collapse. */
:root {
  --page: #111214;
  --panel: #1a1b1e;
  --hover: #26282c;
  --line: #2c2e33;
  --fg: #ececee;
  --muted: #a4a7ae;
  --faint: #80848c;
  --accent: #aac2ff;
  --accent-ink: #1b2236;
  --danger: #f29a9a;
  --hit: rgba(255, 214, 90, 0.28);
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --page: #f4f4f6;
  --panel: #ffffff;
  --hover: #e8e9ed;
  --line: #dcdee3;
  --fg: #17181a;
  --muted: #5d616a;
  --faint: #7b7f88;
  --accent: #3a62d6;
  --accent-ink: #ffffff;
  --danger: #c24141;
  --hit: rgba(255, 190, 40, 0.35);
  color-scheme: light;
}
html, body { height: 100%; }
* { box-sizing: border-box; }
body {
  background: var(--page); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .grip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.shell { max-width: 1500px; margin: 0 auto; display: grid; grid-template-columns: var(--lw, 236px) var(--gl, 16px) minmax(0, 1fr) var(--gr, 16px) var(--rw, 290px); height: 100%; }
.side, .rail, main { min-height: 0; overflow-y: auto; scrollbar-width: thin; }
.grip { position: relative; cursor: col-resize; touch-action: none; }
.grip::after { content: ""; position: absolute; top: 12%; bottom: 12%; left: 50%; width: 3px; margin-left: -1px; border-radius: 3px; background: var(--accent); opacity: 0; transition: opacity 120ms; }
.grip:hover::after, .grip.drag::after, .grip:focus-visible::after { opacity: 0.55; }
.shell.lc .side, .shell.rc .rail { display: none; }

.icon-btn { background: transparent; border: 0; color: var(--muted); border-radius: 8px; width: 30px; height: 30px; padding: 0; display: inline-flex; align-items: center; justify-content: center; flex: none; }
.icon-btn:hover { color: var(--fg); background: var(--hover); }
svg.i { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.label { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); padding: 0 8px 6px; }

/* Left column */
.side { display: flex; flex-direction: column; gap: 12px; padding: 6px 0; min-width: 0; }
.brand { display: flex; align-items: center; justify-content: space-between; padding: 0 8px; font-weight: 600; letter-spacing: -0.01em; }
.nav { display: flex; flex-direction: column; gap: 1px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; text-align: left; background: transparent; border: 0; border-radius: 8px; padding: 4px 8px; color: var(--muted); font-size: 14px; min-width: 0; }
.row:hover { color: var(--fg); background: color-mix(in srgb, var(--hover) 60%, transparent); }
.row[aria-current="true"] { color: var(--fg); background: var(--hover); font-weight: 500; }
.row .t { display: flex; align-items: center; gap: 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.row .n { font-family: var(--font-mono); font-size: 11px; color: var(--faint); flex: none; }
.sub { display: flex; flex-direction: column; gap: 0; margin: 1px 0 4px 14px; padding-left: 8px; border-left: 1px solid var(--line); }
.subrow { text-align: left; background: transparent; border: 0; border-radius: 6px; padding: 3px 8px; color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.subrow:hover { color: var(--fg); background: color-mix(in srgb, var(--hover) 60%, transparent); }
.subrow[aria-current="true"] { color: var(--fg); background: var(--hover); }
.cathead { display: flex; align-items: center; }
.cathead .row { flex: 1; }
.pen { background: transparent; border: 0; color: var(--faint); width: 22px; height: 22px; padding: 0; display: inline-flex; align-items: center; justify-content: center; opacity: 0; border-radius: 6px; flex: none; }
.pen svg { width: 12px; height: 12px; }
.cathead:hover .pen, .pen:focus-visible { opacity: 1; }
.pen:hover { color: var(--fg); }
.rename { width: 100%; background: transparent; border: 0; border-bottom: 1px solid var(--accent); font-size: 14px; padding: 6px 8px; }
.addcat { font-size: 12px; color: var(--faint); background: transparent; border: 0; text-align: left; padding: 4px 8px; }
.addcat:hover { color: var(--muted); }
.foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; }
.tiny { font-size: 11px; color: var(--faint); background: transparent; border: 0; text-align: left; padding: 0 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tiny:hover { color: var(--muted); }
.plan { border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 5px; }
.swatches { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.swatches button { width: 18px; height: 18px; border-radius: 50%; border: 2px solid transparent; padding: 0; }
.swatches button[aria-pressed="true"] { border-color: var(--fg); }
.plan-t { font-size: 13px; font-weight: 600; }
.plan-s { font-size: 12px; color: var(--muted); line-height: 1.4; }
.btn-sub { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 8px; padding: 6px 10px; font-size: 13px; font-weight: 600; }
.search { display: flex; align-items: center; gap: 6px; padding: 0 2px; }
.search input { flex: 1; min-width: 0; background: var(--panel); border: 1px solid transparent; border-radius: 10px; padding: 7px 12px; font-size: 14px; }
.search input::placeholder { color: var(--faint); }
.search input:focus-visible { outline: 0; border-color: var(--accent); }
.res { display: block; width: 100%; text-align: left; background: transparent; border: 0; border-radius: 10px; padding: 6px 10px; min-width: 0; }
.res:hover { background: color-mix(in srgb, var(--hover) 60%, transparent); }
.res[aria-current="true"] { background: var(--panel); }
.res .r1 { font-weight: 500; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.res .r2 { color: var(--muted); font-size: 12.5px; line-height: 1.4; overflow-wrap: anywhere; }
mark.hit { background: var(--hit); color: inherit; border-radius: 3px; padding: 0 1px; }
.noitems { color: var(--faint); font-size: 13px; padding: 4px 10px; }

/* Middle column */
main { background: var(--panel); border-radius: 18px; padding: 18px clamp(20px, 4vw, 48px) 56px; min-width: 0; display: flex; flex-direction: column; gap: 20px; }
.top { display: flex; align-items: center; gap: 8px; min-height: 30px; }
.menu { display: none; }
.crumb { appearance: none; -webkit-appearance: none; background: transparent; border: 0; color: var(--muted); font-size: 13px; padding: 2px 4px; border-radius: 6px; max-width: 50%; }
select.crumb:hover { background: var(--hover); color: var(--fg); }
select.crumb option { background: var(--panel); color: var(--fg); }
.tools { margin-left: auto; display: flex; gap: 2px; }
.tools { align-items: center; }
.tools .fontsel { max-width: none; margin-right: 6px; }
.tools .icon-btn { opacity: 0.7; }
.tools .icon-btn:hover { opacity: 1; }
.tools .icon-btn.danger:hover { color: var(--danger); }
.canvas { font-family: var(--nf, var(--font-body)); position: relative; max-width: 780px; width: 100%; margin: 0 auto; flex: 1; min-height: 420px; --tw: 500px; }
.title-in { display: block; width: 100%; max-width: var(--tw); background: transparent; border: 0; font-size: 30px; font-weight: 600; letter-spacing: -0.02em; padding: 0; margin: 0 0 14px; }
.title-in:focus-visible { outline: 0; }
.bodywrap { position: relative; width: var(--tw); max-width: 100%; }
textarea.body, .mirror { display: block; width: 100%; font-size: 17px; line-height: 1.75; padding: 0; margin: 0; border: 0; white-space: pre-wrap; overflow-wrap: break-word; word-wrap: break-word; }
textarea.body { position: relative; min-height: 360px; resize: none; background: transparent; outline: 0; overflow: hidden; }
.mirror { position: absolute; top: 0; left: 0; color: transparent; pointer-events: none; }
.mirror { font-family: inherit; }
.mirror mark { color: transparent; border-radius: 3px; padding: 0; }
textarea.body::placeholder, .title-in::placeholder { color: var(--faint); }
.pagetext { max-width: var(--tw); font-size: 17px; line-height: 1.75; }
.pagetext p { margin: 0 0 14px; }
.pagetext b { font-weight: 600; }
.pagetext mark { color: inherit; border-radius: 3px; padding: 0; }
.layer { position: absolute; inset: 0; pointer-events: none; }
.conn { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.conn path { fill: none; stroke: var(--muted); stroke-width: 1.4; stroke-dasharray: 4 3; opacity: 0.85; }
.conn circle { fill: var(--muted); }
.empty { margin: 14vh auto 0; text-align: center; color: var(--muted); display: flex; flex-direction: column; gap: 10px; align-items: center; }

.sticker { position: absolute; pointer-events: auto; display: flex; flex-direction: column; min-width: 32px; min-height: 32px; max-width: 50%; max-height: 100%; container-type: size; resize: both; overflow: hidden; border-radius: 4px; color: #2a2410; box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35); }
.sticker .sh { display: flex; align-items: center; justify-content: space-between; height: 20px; padding: 0 4px 0 6px; background: rgba(0, 0, 0, 0.08); cursor: grab; touch-action: none; flex: none; user-select: none; }
.sticker .sh > span { display: flex; align-items: center; gap: 4px; opacity: 0; transition: opacity 120ms; }
.sticker:hover .sh > span, .sticker:focus-within .sh > span, .sticker:hover .stb, .sticker:focus-within .stb { opacity: 1; }
@media (hover: none) { .sticker .sh > span, .sticker .stb { opacity: 1; } }
.sticker .sh button { background: transparent; border: 0; color: #2a2410; font-size: 14px; line-height: 1; padding: 0 3px; }
.sticker .sh .sz { font-size: 10px; letter-spacing: 0.04em; font-weight: 600; }
.sticker .dot { width: 11px; height: 11px; border-radius: 50%; padding: 0; border: 1px solid rgba(0, 0, 0, 0.25); }
.sticker .dot.locked { opacity: 0.3; cursor: default; }
.stb { display: flex; align-items: center; gap: 4px; height: 24px; padding: 0 6px; flex: none; opacity: 0; transition: opacity 120ms; }
.stb .fb { width: 22px; height: 18px; padding: 0; border: 1px solid rgba(0, 0, 0, 0.22); border-radius: 4px; background: rgba(255, 255, 255, 0.3); color: #2a2410; font-size: 12px; line-height: 1; }
.stb .fsel { font-size: 11px; max-width: 112px; min-width: 0; height: 18px; border: 0; border-radius: 4px; background: rgba(255, 255, 255, 0.35); color: #2a2410; padding: 0 2px; }
.sticker .stxt { flex: 1; min-height: 0; width: 100%; overflow: auto; outline: 0; color: #2a2410; font-size: 14px; line-height: 1.4; padding: 4px 8px 6px; overflow-wrap: anywhere; }
.sticker .stxt:empty::before { content: attr(data-ph); opacity: 0.5; }
@container (max-width: 110px) {
  .sh { height: 12px; padding: 0 2px; }
  .sh > span:first-child, .sh .sz { display: none; }
  .sh button { font-size: 11px; padding: 0 2px; }
  .stb { display: none; }
  .stxt { font-size: 11px; line-height: 1.2; padding: 2px 4px; }
}
@container (max-height: 80px) { .stb { display: none; } }

/* Calendar list */
.week { max-width: 640px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
.week h1 { font-size: 30px; font-weight: 600; letter-spacing: -0.02em; margin: 0; }
.day { display: flex; flex-direction: column; gap: 2px; }
.day h2 { font-size: 12px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); margin: 0 0 4px; display: flex; gap: 8px; align-items: center; }
.day.today h2 { color: var(--accent); }
.evrow { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 12px; width: 100%; text-align: left; background: transparent; border: 0; border-radius: 8px; padding: 6px 8px; }
.evrow:hover, .evrow[aria-expanded="true"] { background: var(--hover); }
.evrow .tm { white-space: nowrap; color: var(--faint); font-family: var(--font-mono); font-size: 12px; padding-top: 2px; }
.evrow .ti { min-width: 0; overflow-wrap: anywhere; }
.evrow .nt { display: block; color: var(--muted); font-size: 13px; }
.evnote { margin: 2px 0 8px 170px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.evnote textarea { width: 100%; min-height: 64px; resize: vertical; background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; line-height: 1.5; }
.link { background: transparent; border: 0; color: var(--accent); padding: 0; font-size: 13px; }
.gline { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; font-size: 13px; color: var(--muted); }

.lockbox { max-width: 260px; margin: 12vh auto 0; display: flex; flex-direction: column; gap: 12px; text-align: center; align-items: stretch; }
.lockbox svg { align-self: center; }
.lockbox input { background: transparent; border: 0; border-bottom: 1px solid var(--line); text-align: center; letter-spacing: 0.4em; font-size: 22px; padding: 6px; }
.lockbox input:focus-visible { outline: 0; border-bottom-color: var(--accent); }
.err { color: var(--danger); font-size: 13px; }
.muted { color: var(--muted); font-size: 13px; }

.trashv { max-width: 640px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 6px; }
.trashv h1 { font-size: 30px; font-weight: 600; letter-spacing: -0.02em; margin: 0 0 4px; }
.trow { display: flex; align-items: center; gap: 12px; padding: 8px 10px; border-radius: 10px; }
.trow:hover { background: var(--hover); }
.trow .tt { flex: 1; min-width: 0; }
.trow .tt1 { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.trow .tt2 { font-size: 12px; color: var(--faint); }
.trow .link.del { color: var(--danger); }

.ctx { position: fixed; z-index: 60; min-width: 150px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 4px; box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35); display: flex; flex-direction: column; }
.ctxi { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: transparent; border: 0; border-radius: 7px; padding: 7px 10px; font-size: 14px; color: var(--fg); }
.ctxi:hover, .ctxi:focus-visible { background: var(--hover); outline: 0; }
.ctxi.del { color: var(--danger); }
.scrim { position: fixed; inset: 0; z-index: 90; background: rgba(0, 0, 0, 0.55); display: flex; align-items: center; justify-content: center; padding: 16px; }
.dlg { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 22px; width: min(380px, 100%); display: flex; flex-direction: column; gap: 10px; }
.dlg-t { font-weight: 600; font-size: 16px; }
.dlg-b { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
.btn-ghost, .btn-del { border-radius: 8px; padding: 7px 14px; font-size: 14px; font-weight: 600; border: 1px solid var(--line); background: transparent; }
.btn-ghost:hover { background: var(--hover); }
.btn-del { background: var(--danger); border-color: var(--danger); color: #1a0d0d; }
.spine { display: inline-block; width: 4px; height: 14px; border-radius: 2px; flex: none; }
.imgs { display: flex; flex-wrap: wrap; gap: 10px; max-width: var(--tw); margin: 0 0 14px; }
.imgs .im { position: relative; }
.imgs img { display: block; max-height: 140px; max-width: 100%; border-radius: 10px; }
.imgs .imx { position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; border: 0; border-radius: 50%; background: rgba(0, 0, 0, 0.55); color: #fff; line-height: 1; padding: 0; opacity: 0; }
.imgs .im:hover .imx, .imgs .imx:focus-visible { opacity: 1; }
@media (hover: none) { .imgs .imx { opacity: 1; } }
.tasks { display: flex; flex-direction: column; gap: 2px; }
.task { display: flex; align-items: flex-start; gap: 10px; padding: 6px 8px 6px 10px; border-radius: 10px; }
.task:hover { background: color-mix(in srgb, var(--hover) 60%, transparent); }
.chk { width: 22px; height: 22px; margin-top: 1px; border-radius: 50%; border: 2px solid var(--accent); background: transparent; padding: 0; display: inline-flex; align-items: center; justify-content: center; flex: none; color: var(--accent-ink); }
.task.done .chk { background: var(--accent); }
.chk svg { width: 13px; height: 13px; stroke-width: 2.6; }
.tbody { flex: 1; min-width: 0; }
.ttl { font-size: 14px; overflow-wrap: anywhere; }
.task.done .ttl { text-decoration: line-through; color: var(--faint); }
.tdue { font-size: 12px; color: var(--faint); }
.tdue.late { color: var(--danger); }
.task .icon-btn { width: 24px; height: 24px; }
.task .bell[aria-pressed="true"] { color: var(--accent); }
.task .tx { opacity: 0; font-size: 16px; }
.task:hover .tx, .task .tx:focus-visible { opacity: 1; }
@media (hover: none) { .task .tx { opacity: 1; } }

/* Right column */
.rail { display: flex; flex-direction: column; gap: 14px; padding: 6px 0; min-width: 0; }
.rhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.rhead .label { flex: 1; padding-bottom: 0; font-size: 12px; }
.soon { display: flex; flex-direction: column; gap: 2px; }
.soon .dh { font-size: 12px; color: var(--faint); padding: 8px 10px 2px; }
.soon .dh.t { color: var(--accent); }
.srow { display: grid; grid-template-columns: 62px minmax(0, 1fr); gap: 8px; text-align: left; width: 100%; background: transparent; border: 0; border-radius: 8px; padding: 4px 10px; font-size: 14px; }
.srow:hover { background: color-mix(in srgb, var(--hover) 60%, transparent); }
.srow .tm { color: var(--faint); font-family: var(--font-mono); font-size: 11px; padding-top: 3px; white-space: nowrap; }
.srow .ti { min-width: 0; overflow-wrap: anywhere; }
.srow .has { color: var(--accent); font-size: 12px; display: block; }

.toast-act { background: transparent; border: 0; color: inherit; font-weight: 700; text-decoration: underline; margin-left: 10px; padding: 0; }
.toast { position: fixed; left: 50%; bottom: max(24px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--page); border-radius: 999px; padding: 7px 16px; font-size: 13px; z-index: 50; max-width: 90vw; }
.login { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; padding: 16px; background: var(--page); }
.login-card { background: var(--panel); border-radius: 16px; padding: 28px; width: min(360px, 100%); display: flex; flex-direction: column; gap: 14px; }
.login-card h1 { font-size: 22px; margin: 0; letter-spacing: -0.02em; }
.login-card input { background: transparent; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 15px; }
.login-card .btn-sub { padding: 10px; font-size: 14px; }
.backdrop { display: none; }

@media (max-width: 900px) {
  .shell { grid-template-columns: 216px minmax(0, 1fr); height: auto; column-gap: 14px; }
  .grip { display: none; }
  .side { grid-row: 1 / span 2; position: sticky; top: 16px; max-height: calc(100vh - 32px); }
  .shell.lc .side, .shell.rc .rail { display: flex; }
  .rail, main { overflow: visible; }
  .rail { grid-column: 2; }
  .cbtn, .expand { display: none; }
}
@media (max-width: 760px) {
  .shell { display: flex; flex-direction: column; gap: 16px; height: auto; }
  .rail, main { overflow: visible; }
  main { min-height: 60vh; padding-top: 12px; }
  .menu { display: inline-flex; }
  .side { position: fixed; z-index: 30; top: 0; bottom: 0; left: 0; max-height: none; overflow-y: auto; width: min(280px, 84vw); background: var(--page); border-right: 1px solid var(--line); transform: translateX(-100%); padding: max(16px, env(safe-area-inset-top, 0px)) 10px 16px max(10px, env(safe-area-inset-left, 0px)); }
  .side.open { transform: none; }
  .backdrop.open { display: block; position: fixed; inset: 0; z-index: 20; background: rgba(0, 0, 0, 0.55); }
  .evrow { grid-template-columns: 96px minmax(0, 1fr); }
  .evnote { margin-left: 8px; }
  .pen { opacity: 0.6; }
}
@media (max-width: 760px) and (prefers-reduced-motion: no-preference) { .side { transition: transform 200ms ease; } }
</style>
</head>
<body>

<div class="shell" id="shell">
  <aside class="side" id="side" aria-label="Notes"></aside>
  <div class="grip" id="gripL" role="separator" aria-orientation="vertical" aria-label="Resize left bar" tabindex="0"></div>
  <main id="main"></main>
  <div class="grip" id="gripR" role="separator" aria-orientation="vertical" aria-label="Resize right bar" tabindex="0"></div>
  <aside class="rail" id="rail" aria-label="Coming up"></aside>
  <div class="backdrop" id="backdrop"></div>
</div>
<div id="toast" class="toast" hidden></div>

<script>
(function () {
  var KEY = "noteme-v5";
